[project]
name = "opspilot-ai"
version = "0.1.0"
description = "OpsPilot AI - eight engineering workflows for AP/procurement operations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "pytesseract>=0.3.10",
    "rapidfuzz>=3.6",
    "reportlab>=4.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pandas>=2.1",
    "pandera>=0.20",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
demo = ["streamlit>=1.50", "altair>=5", "duckdb>=1.0", "fastapi", "httpx"]
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]       # CPU build on macOS
mac = ["ocrmac>=1.0"]                                     # Apple Vision OCR, macOS only
augraphy = ["augraphy>=8.0"]                              # optional extra degradations
duckdb = ["duckdb>=1.0"]                                  # local KPI engine, no server needed
dbt = ["dbt-core>=1.8", "dbt-postgres>=1.8"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy", "sqlfluff>=3.0", "playwright>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: needs the tesseract binary", "db: needs a Postgres test database", "dbt: needs dbt-postgres and a database"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
extend-ignore = ["B008", "BLE001", "C408", "RUF007", "RUF059", "DTZ011", "PLW1508", "SIM117", "PIE810", "PERF102", "RUF046", "C405"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C408", "SIM117", "PLW1510", "S101"]
